<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WorkTime</title>
    <script>
      // Apply the surface-local theme before first paint so a Light or System
      // preference never flashes the Dark default while the app boots. The key
      // and accepted values mirror src/lib/theme/themePreference.ts.
      (function () {
        try {
          var stored = window.localStorage.getItem("worktime:theme:v1");
          var dark =
            stored === "light"
              ? false
              : stored === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                : true;
          var theme = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#fafafa");
        } catch (error) {
          // Unavailable storage keeps the static Dark default from <html>.
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
